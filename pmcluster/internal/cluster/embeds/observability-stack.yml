## pmcluster-config-version: __PMCONFIG_VERSION__
version: "3.9"

services:
  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:v0.30.0
    # No entrypoint override — the image is distroless (no /bin/sh).
    # ZO_ROOT_USER_PASSWORD is rendered directly by pmcluster at deploy
    # time from the managed credential. It flows through `docker stack deploy`
    # stdin only, never persisted to disk.
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [node.role == manager]
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.openobserve.rule=Host(`observ.${DOMAIN}`)"
        - "traefik.http.services.openobserve.loadbalancer.server.port=5080"
        - "traefik.http.routers.openobserve.entrypoints=websecure"
        - "traefik.http.routers.openobserve.tls=true"
        [[- if .ACMEEmail]]
        - "traefik.http.routers.openobserve.tls.certresolver=letsencrypt"
        [[- end]]
        - "traefik.http.routers.openobserve.middlewares=cors-default@file"
        - "traefik.swarm.network=traefik-net"
    environment:
      - ZO_DATA_DIR=/data
      - ZO_HTTP_PORT=5080
      - ZO_GRPC_PORT=5081
      - ZO_TELEMETRY=false
      - ZO_APP_NAME=openobserve
      - ZO_ROOT_USER_EMAIL=${OPENOBSERVE_ADMIN_EMAIL}
      - ZO_ROOT_USER_PASSWORD=__OPENOBSERVE_PASSWORD__
    volumes:
      - openobserve_data:/data
    networks:
      - monitoring-net
      - traefik-net
      

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.142.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    user: "0:0"
    deploy:
      mode: global
      resources:
        reservations:
          cpus: '0.3'
          memory: 256M
        limits:
          cpus: '0.4'
          memory: 512M
      restart_policy:
        condition: any
        delay: 5s
    # Host-mode port so the pmcluster daemon (running on the manager
    # host, not in Swarm) can ship its own traces/metrics/logs via
    # OTLP/HTTP. mode: host binds the port on each node that runs the
    # collector (global service). NOTE: docker stack deploy does not
    # support host_ip; the port will be published on all interfaces.
    # gRPC (4317) stays internal.
    ports:
      - target: 4318
        published: 4318
        protocol: tcp
        mode: host
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/localtime:/etc/localtime:ro
    configs:
      - source: __OTEL_CONFIG_NAME__
        target: /etc/otel-collector-config.yaml
    networks:
      - monitoring-net

volumes:
  openobserve_data:

networks:
  monitoring-net:
    external: true
  traefik-net:
    external: true

secrets:
  # zo_root_user_password is managed by pmcluster as a Swarm secret for
  # rotating credentials, but the password is rendered directly into the
  # ZO_ROOT_USER_PASSWORD env var at deploy time (no /bin/sh needed).
  zo_root_user_password:
    external: true

# Docker configs are created+managed by pmcluster cluster up. Replicated to
# every node by Swarm itself, so the otel-collector global service can mount
# the config without bind-mount-from-disk multi-node fragility.
configs:
  __OTEL_CONFIG_NAME__:
    external: true

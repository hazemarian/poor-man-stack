version: "2"
run:
  timeout: 3m
  tests: true
linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - gocritic
    - revive
  settings:
    revive:
      rules:
        - name: var-naming
        - name: package-comments
        - name: unused-parameter
          disabled: true
        - name: exported
          disabled: true
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (*net/http.Response).Body.Close
        - (io.Closer).Close
        - (*os.File).Close
        - (*database/sql.Rows).Close
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - revive
          - unused
          - errcheck
      - text: "var-naming: avoid meaningless package names"
        linters:
          - revive
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports

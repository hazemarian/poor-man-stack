version: "2"
run:
  timeout: 3m
  tests: true
linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - gocritic
    - revive
  settings:
    revive:
      rules:
        - name: var-naming
        - name: exported
        - name: package-comments
        - name: unused-parameter
          disabled: true
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports

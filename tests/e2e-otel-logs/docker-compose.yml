version: "3.9"

services:
  test-app:
    image: alpine:3.21
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        i=0
        while [ $$i -lt 10 ]; do
          i=$$((i+1))
          echo "{\"log\":\"test-app message #$$i at $$(date -u +%Y-%m-%dT%H:%M:%S.000Z)\n\",\"stream\":\"stdout\",\"time\":\"$$(date -u +%Y-%m-%dT%H:%M:%S.000000000Z)\"}"
          sleep 1
        done
        echo "Done writing logs."
        sleep 30
    labels:
      - "com.docker.compose.service=test-app"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.157.0
    command: ["--config=/etc/otel-config.yaml"]
    user: "0:0"
    volumes:
      - ./otel-config-e2e.yml:/etc/otel-config.yaml:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # No port mapping needed — debug exporter writes to stdout

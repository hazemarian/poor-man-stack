name: pmcluster

on:
  push:
    branches: [main]
    paths:
      - "pmcluster/**"
      - ".github/workflows/pmcluster.yml"
  pull_request:
    paths:
      - "pmcluster/**"
      - ".github/workflows/pmcluster.yml"

jobs:
  test:
    name: build + unit tests + smoke e2e (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.25"]
    defaults:
      run:
        working-directory: pmcluster
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
          cache-dependency-path: pmcluster/go.sum

      - name: go vet
        run: make vet

      - name: build
        run: make build

      - name: unit tests
        run: make test

      - name: smoke e2e
        run: make e2e

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pmcluster
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: pmcluster/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          # v2.x matches the schema in pmcluster/.golangci.yml.
          version: latest
          working-directory: pmcluster
          args: --timeout=5m

  swarm-e2e:
    name: cluster up + deploy + webhook e2e (real swarm)
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: pmcluster
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: pmcluster/go.sum

      # ubuntu-latest already has Docker + the docker CLI installed; no
      # privileged container needed since we run dockerd on the host.
      - name: swarm e2e
        env:
          PMCLUSTER_E2E_SWARM: "1"
        run: make e2e
